<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TradingView chart</title>
  <style>html,body,.tradingview-widget-container,.tradingview-widget-container__widget{width:100%;height:100%;margin:0}body{background:#fff;font:14px sans-serif}#widget-error{position:absolute;inset:0;padding:24px;text-align:center;background:#fff}</style>
</head>
<body>
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <div id="widget-error" hidden>TradingView chart could not load. Check your connection or use the custom indicator chart.</div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" onerror="document.getElementById('widget-error').hidden = false" async>
    {
      "autosize": true,
      "symbol": "FX_IDC:EURUSD",
      "interval": "240",
      "timezone": "Etc/UTC",
      "theme": "light",
      "style": "1",
      "locale": "en",
      "hide_side_toolbar": false,
      "allow_symbol_change": true,
      "withdateranges": true,
      "watchlist": [
        "FX_IDC:EURUSD", "FX_IDC:GBPUSD", "FX_IDC:USDJPY", "FX_IDC:USDCHF",
        "FX_IDC:USDCAD", "FX_IDC:AUDUSD", "FX_IDC:NZDUSD", "FX_IDC:EURAUD",
        "FX_IDC:EURCAD", "FX_IDC:EURCHF", "FX_IDC:EURGBP", "FX_IDC:EURJPY",
        "FX_IDC:EURNZD", "FX_IDC:GBPAUD", "FX_IDC:GBPCAD", "FX_IDC:GBPCHF",
        "FX_IDC:GBPJPY", "FX_IDC:GBPNZD", "FX_IDC:AUDCAD", "FX_IDC:AUDCHF",
        "FX_IDC:AUDJPY", "FX_IDC:AUDNZD", "FX_IDC:CADCHF", "FX_IDC:CADJPY",
        "FX_IDC:CHFJPY", "FX_IDC:NZDCAD", "FX_IDC:NZDCHF", "FX_IDC:NZDJPY",
        "FX_IDC:XAUUSD"
      ],
      "support_host": "https://www.tradingview.com"
    }
    </script>
  </div>
</body>
</html>
